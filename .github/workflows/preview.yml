name: Preview Package

# Publishes an installable preview of @mux/ai to pkg.pr.new for every PR and
# every push to main, so a change can be tried in a real project (e.g. Robots)
# before it is released. Nothing is published to npm.
# See https://github.com/stackblitz-labs/pkg.pr.new
#
# Requires the pkg.pr.new GitHub App on the repository:
# https://github.com/apps/pkg-pr-new
on:
  push:
    branches:
      - main
  pull_request:

# A preview is an installable artifact carrying the @mux/ai name, built from
# whatever code is checked out. Grant no scopes and expose no secrets here.
permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Only build code someone with write access pushed: pushes to main, and PRs
    # whose branch lives in this repository. Fork PRs get no preview.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # pkg.pr.new keys previews by commit, so build the PR's head commit rather
      # than the merge ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Version previews 0.0.0-preview-<sha> so a preview can never satisfy a
      # semver range meant for a real release. Set it before building: the
      # bundle embeds package.json's version, so the preview reports its own
      # version at runtime, matching its manifest.
      - name: Set preview version
        run: npm version "0.0.0-preview-$(git rev-parse --short=7 HEAD)" --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Publish preview
        run: npx --yes pkg-pr-new@0.0.93 publish
